<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#181c24"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#111318" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left Accent Bar -->
  <rect x="80" y="80" width="6" height="470" rx="3" fill="url(#brand)"/>

  <!-- Brand Title -->
  <text x="120" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="4" fill="#f59e0b">OPEN ONLINE ASSESSMENT</text>
  
  <text x="120" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="100" font-weight="900" letter-spacing="-3" fill="#f1f5f9">OA <tspan fill="url(#brand)">Open</tspan></text>
  
  <text x="120" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#94a3b8">Free, open-source OA practice for top companies</text>
  
  <!-- Pill Badges -->
  <g transform="translate(120, 410)">
    <rect width="310" height="48" rx="24" fill="#202530" stroke="rgba(255,255,255,0.1)"/>
    <text x="24" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="700" fill="#f1f5f9">1,798 Questions</text>
    
    <rect x="330" width="310" height="48" rx="24" fill="#202530" stroke="rgba(255,255,255,0.1)"/>
    <text x="354" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="700" fill="#f1f5f9">5 Company Patterns</text>
    
    <rect x="660" width="310" height="48" rx="24" fill="#202530" stroke="rgba(255,255,255,0.1)"/>
    <text x="684" y="32" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="700" fill="#f1f5f9">Python &amp; SQL WASM</text>
  </g>

  <!-- URL -->
  <text x="120" y="530" font-family="'JetBrains Mono', Consolas, monospace" font-size="24" font-weight="600" fill="#f59e0b">https://oa-open.app</text>
</svg>